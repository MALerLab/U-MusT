data_path: [
  # name, path, modal_types, max weight, (start iter, max iter)
  ['lsyt_piano', 'latent_score_dataset_tokens/', ['dac', 'pt'], 0.02, [50000, 70000]], 
  ['grandstaff-lmx', 'grandstaff-lmx/', ['lmx', 'pt'], 0.02, [0,0]],
  ['olimpic', 'olimpic/', ['lmx', 'pt'], 0.03, [0,0]],
  ['maestro', 'maestro/', ['midi', 'dac'], 2.0, [15000, 50000]],
]
data_dir: dataset/
metadata_dir: dataset_pair_paths
exp_name: omr_direction_piano
dataset: MultimodalTokenDatasetMaker
bucket:
  use_bucket: False
#   class_name: TwoDimKBucketSampler # TwoDimKBucketSampler
#   n_buckets: 6 # number of buckets
max_seq_len: {"lmx": 1400, "midi": 1000, "pt": 1000, "dac": 1750} # pt 200: width of image token array
max_pt_x_len: 150
n_codebook: 4
codebook_size: 1024
num_special_tokens: 1 #For multimodal_trans, this must be 1 since there is a universal pad token. single sos/eos token for each modality.
image_height: 416 # max input height
image_compress_factor: 16
midi_max_shift: 641
in_modal_type: ['pt', 'midi']
out_modal_type: ['lmx', 'dac']
modal_direction: 'omr' # only go to pt -> lmx -> midi -> dac
lmx_vocab_path: vocab/lmx_vocab_singletoken.txt
midi_slice_len: 20
tps: 32
out_pt_height_token: True

vq_model: unirqvae
dac_model: unidac4

preload_data: 'midi_only'