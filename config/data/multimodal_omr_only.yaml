data_path: [
  ['grandstaff-lmx', 'grandstaff-lmx/', ['lmx', 'pt'], 0.2, [0, 0]],
  ['olimpic', 'olimpic/', ['lmx', 'pt'], 1, [0, 0]],

]
data_dir: dataset/
metadata_dir: dataset_pair_paths
exp_name: omr_only
dataset: MultimodalTokenDatasetMaker
bucket:
  use_bucket: False
#   class_name: TwoDimKBucketSampler # TwoDimKBucketSampler
#   n_buckets: 6 # number of buckets
max_seq_len: {"lmx": 1400, "midi": 2000, "pt": 2000, "dac": 2000} # pt 200: width of image token array
max_pt_x_len: 150
n_codebook: 4
codebook_size: 1024
num_special_tokens: 1 #For multimodal_trans, this must be 1 since there is a universal pad token. single sos/eos token for each modality.
image_height: 416 # max input height
image_compress_factor: 16
midi_max_shift: 1001
in_modal_type: ['pt']
out_modal_type: ['lmx']
modal_direction: 'omr'
out_pt_height_token: True

vq_model: unirqvae
dac_model: null

preload_data: False